- tag: "Earth System Model"
  title: "CanESM — Canadian Earth System Model"
  description: >
    I coordinate development of the Canadian Earth System Model (CanESM), and
    its application in the Coupled Model Intercomparison Project (CMIP). As
    team lead of the CanESM development team I manage a team of scientists and
    technical staff, including work planning, career development and
    administrative management.
  links:
    - label: "Swart et al. 2019"
      doi: "10.5194/gmd-12-4823-2019"
      icon: "fas fa-file-alt"
    - label: "Sigmond et al. 2023"
      doi: "10.5194/gmd-16-6553-2023"
      icon: "fas fa-file-alt"
    - label: "CCCma GitLab"
      url: "https://gitlab.com/cccma"
      icon: "fab fa-gitlab"

- tag: "International Initiative"
  title: "SOFIA — Southern Ocean Freshwater Input from Antarctica"
  description: >
    The Southern Ocean Freshwater Input from Antarctica (SOFIA) Initiative is
    an international model intercomparison project concerned with the scientific
    objectives and experimental design needed to understand the effects of
    Antarctic meltwater on the Southern Ocean and global climate system.
  links:
    - label: "Swart et al. 2023"
      doi: "10.5194/gmd-16-7289-2023"
      icon: "fas fa-file-alt"

- tag: "National Initiative"
  title: "CP4C — Climate Prediction for Canada"
  description: >
    Climate Prediction for Canada (CP4C) is a national initiative to develop
    and deliver climate predictions on seasonal to decadal timescales for
    Canada, underpinned by CanESM model development and large ensemble
    simulations.

- tag: "Model Evaluation"
  title: "CanTODS — Canadian Trend and Observational Diagnostics Suite"
  description: >
    CanTODS is a software suite for the systematic evaluation of climate model
    trends against observations, developed to support transparent and
    reproducible assessment of CanESM and other CMIP models.
  links:
    - label: "GitHub"
      url: "https://github.com/swartn"
      icon: "fab fa-github"

- tag: "Large Ensemble"
  title: "CanESM Large Ensemble"
  description: >
    Large initial-condition ensembles of CanESM2 and CanESM5 simulations used
    to separate the forced climate change signal from internal variability, and
    widely applied in detection and attribution research and climate projection
    studies.
